<body><canvas id="c" width="1280" height="720"></canvas>

const W = 1280, H = 720, cv = document.getElementById('c'), g = cv.getContext('2d');

const ease = (t) => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);

// ---------- terminal emulator (same as the player) ----------
const PAL = (n) => { if (n < 16) return ['#000', '#c00', '#0a0', '#c90', '#37f', '#a0a', '#0aa', '#ccc', '#555', '#f55', '#5f5', '#ff5', '#59f', '#f5f', '#5ff', '#fff'][n]; if (n < 232) { n -= 16; const c = [0, 95, 135, 175, 215, 255]; return `rgb(${c[Math.floor(n / 36)]},${c[Math.floor(n / 6) % 6]},${c[n % 6]})`; } const v = 8 + (n - 232) * 10; return `rgb(${v},${v},${v})`; };
function Term() {
  let lines = [[]], row = 0, col = 0, st = { b: 0, d: 0, fg: null, bg: null };
  const sgr = (p) => { if (!p.length) p = [0]; for (let i = 0; i < p.length; i++) { const n = p[i]; if (n === 0) st = { b: 0, d: 0, fg: null, bg: null }; else if (n === 1) st.b = 1; else if (n === 2) st.d = 1; else if (n === 22) { st.b = 0; st.d = 0; } else if (n === 39) st.fg = null; else if (n === 49) st.bg = null; else if (n >= 30 && n <= 37) st.fg = PAL(n - 30); else if (n >= 90 && n <= 97) st.fg = PAL(n - 82); else if (n === 38 && p[i + 1] === 5) { st.fg = PAL(p[i + 2]); i += 2; } else if (n === 48 && p[i + 1] === 5) { st.bg = PAL(p[i + 2]); i += 2; } } };
  const put = (ch) => { const L = lines[row] || (lines[row] = []); L[col] = { c: ch, s: { ...st } }; col++; };
  return {
    feed(s) { for (let i = 0; i < s.length; i++) { const ch = s[i]; if (ch === '\x1b' && s[i + 1] === '[') { let j = i + 2; while (j < s.length && !/[A-Za-z]/.test(s[j])) j++; const f = s[j], p = s.slice(i + 2, j).replace('?', '').split(';').filter((x) => x !== '').map(Number); i = j;
      if (f === 'm') sgr(p); else if (f === 'A') row = Math.max(0, row - (p[0] || 1)); else if (f === 'J') { if (!p.length || p[0] === 0) { lines[row] = (lines[row] || []).slice(0, col); lines.length = row + 1; } else { lines = [[]]; row = 0; col = 0; } } else if (f === 'H') { row = 0; col = 0; } else if (f === 'K') lines[row] = (lines[row] || []).slice(0, col); }
      else if (ch === '\r') col = 0; else if (ch === '\n') { row++; col = 0; if (!lines[row]) lines[row] = []; } else if (ch >= ' ') put(ch); } },
    draw(x0, y0, rows, fs, cw, ch) {
      const start = Math.max(0, lines.length - rows);
      for (let r = start; r < lines.length; r++) { const L = lines[r] || []; const y = y0 + (r - start) * ch;
        for (let c = 0; c < L.length; c++) { const x = L[c]; if (x && x.s.bg) { g.fillStyle = x.s.bg; g.fillRect(x0 + c * cw, y - ch + 4, cw + 0.6, ch); } }
        for (let c = 0; c < L.length; c++) { const x = L[c]; if (!x || x.c === ' ') continue; g.font = `${x.s.b ? '700 ' : ''}${fs}px ${MONO}`; g.globalAlpha = x.s.d ? 0.62 : 1; g.fillStyle = x.s.fg || '#e6edf3'; g.fillText(x.c, x0 + c * cw, y); } }
      g.globalAlpha = 1;
    },
  };

// ---------- drawing helpers ----------

  const w = Math.max(w1, w2) + 48, h = sub ? 96 : 62, x = 40, y = H - h - 34;
  g.fillStyle = 'rgba(13,17,23,0.86)'; rr(x, y, w, h, 16); g.fill(); g.fillStyle = '#0ac18e'; rr(x, y, 8, h, 4); g.fill();
  g.fillStyle = '#fff'; g.font = `800 34px ${FONT}`; g.fillText(text, x + 26, y + 44);
  if (sub) { g.fillStyle = '#b8c4bc'; g.font = `500 20px ${FONT}`; g.fillText(sub, x + 26, y + 78); }
}
function coin3d(cx, cy, r, angle, logo) { // flat logo turned into a spinning coin (fake 3D)
  const sx = Math.cos(angle); const edge = Math.max(6, r * 0.12);

}
function fadeIn(t, d = 0.45) { if (t < d) { g.fillStyle = `rgba(0,0,0,${1 - t / d})`; g.fillRect(0, 0, W, H); } }
function fadeOut(t, dur, d = 0.35) { if (t > dur - d) { g.fillStyle = `rgba(0,0,0,${(t - (dur - d)) / d})`; g.fillRect(0, 0, W, H); } }

// ---------- scenes ----------
let A = {};
function sceneProblem(t, dur) {
  const split = dur * 0.56; // the voice turns from problem to solution here
  if (t < split) {
    drawVS(t, t / split);
  } else {
    const u = t - split, d2 = dur - split;
    const grd = g.createRadialGradient(640, 330, 40, 640, 360, 760); grd.addColorStop(0, '#0e3b2c'); grd.addColorStop(1, '#06130e'); g.fillStyle = grd; g.fillRect(0, 0, W, H);
    // coins raining
    for (let i = 0; i < 26; i++) { const x = (i * 137) % W, sp = 120 + (i * 53) % 140, y = ((u * sp + i * 90) % (H + 120)) - 60; coin3d(x, y, 16 + (i % 3) * 6, u * 3 + i, A.logo); }
    g.fillStyle = 'rgba(6,19,14,0.55)'; g.fillRect(0, 0, W, H);
    // hero coin flip-in

    g.globalAlpha = ease((u - 0.6) / 0.8); g.fillStyle = '#fff'; g.font = `800 64px ${FONT}`; let s = 'PassBCH.cash'; g.fillText(s, 640 - g.measureText(s).width / 2, 410);

    // terminal typing the command + a friend's terminal connected
    const cmd = 'npx passbch'; const n = Math.max(0, Math.floor((u - 1.8) * 16));

    g.fillStyle = '#0d1117'; rr(170, 500, 520, 130, 12); g.fill(); g.strokeStyle = '#0ac18e'; g.lineWidth = 2; g.stroke();
    g.fillStyle = '#8b949e'; g.font = `600 15px ${FONT}`; g.fillText('your terminal', 190, 528);
    g.fillStyle = '#e6edf3'; g.font = `20px ${MONO}`; g.fillText('> ' + cmd.slice(0, n) + (Math.floor(u * 3) % 2 ? '▌' : ''), 190, 570);
    if (n >= cmd.length) { g.fillStyle = '#5ff'; g.font = `700 18px ${MONO}`; g.fillText('▸ Coin Flip · Typing Race · RPS', 190, 604); }
    g.fillStyle = '#0d1117'; rr(800, 500, 310, 130, 12); g.fill(); g.strokeStyle = '#ff3df0'; g.stroke();

  }
}
function sceneIntro(t, dur) {

  g.fillStyle = '#e6edf3'; g.font = `22px ${MONO}`; s = 'irm https://passbch.vercel.app | iex'; g.fillText(s, 640 - g.measureText(s).width / 2, 500); s = 'curl -sL passbch.vercel.app | sh'; g.fillText(s, 640 - g.measureText(s).width / 2, 536);

// ---------- main (terminal-first cut, no music) ----------
function chrome(x, y, w, h, title, accent) {
